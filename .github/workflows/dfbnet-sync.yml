name: DFBnet Spielstätten Sync

on:
  schedule:
    # 06:00–23:59 Uhr: alle 5 Minuten (Ortszeit Deutschland)
    - cron: "*/5 6-23 * * *"
      timezone: "Europe/Berlin"
    # 00:00–05:59 Uhr: einmal pro Stunde, bewusst Minute 17
    # statt Minute 00, um GitHub-Spitzenlast zur vollen Stunde zu vermeiden.
    - cron: "17 0-5 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfbnet-spielstaetten-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: DFBnet mit Supabase synchronisieren
        run: npm run sync
        env:
          DFBNET_USERNAME: ${{ secrets.DFBNET_USERNAME }}
          DFBNET_PASSWORD: ${{ secrets.DFBNET_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fehler-Screenshot sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dfbnet-sync-error
          path: dfbnet-sync-error.png
          if-no-files-found: ignore
          retention-days: 3
